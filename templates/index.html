<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student App — DevOps Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .card h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card .subtitle { color: #94a3b8; margin-bottom: 28px; font-size: 0.95rem; }
        .info { text-align: left; margin-top: 12px; }
        .info div {
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .info .label { color: #94a3b8; }
        .info .value { color: #e2e8f0; font-weight: 600; }
        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 20px;
            border-radius: 999px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Student App</h1>
        <p class="subtitle">DevOps Lifecycle Demo — ISE-2 Assignment</p>

        <div class="info">
            <div>
                <span class="label">Name</span>
                <span class="value">Zeenat</span>
            </div>
            <div>
                <span class="label">Subject</span>
                <span class="value">ISE-2 — DevOps</span>
            </div>
            <div>
                <span class="label">Stack</span>
                <span class="value">Flask · Docker · Jenkins</span>
            </div>
            <div>
                <span class="label">Status</span>
                <span class="value" style="color:#4ade80;">● Running</span>
            </div>
        </div>

        <span class="badge">CONTAINERIZED WITH DOCKER 🐳</span>
    </div>
</body>
</html>
